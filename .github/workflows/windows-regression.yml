name: Windows regression

on:
  push:
    branches: [codex/studio-performance-ci]

permissions:
  contents: read

concurrency:
  group: windows-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      CI: 'true'
      TZ: Asia/Shanghai
      NODE_PATH: ${{ github.workspace }}/node_modules
    steps:
      - name: Keep source line endings
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Prepare locked Electron runtime
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            node scripts/prepare-ci-electron.mjs
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { exit $LASTEXITCODE }
            Start-Sleep -Seconds ($attempt * 5)
          }
          node -e "const fs=require('fs'),assert=require('assert/strict'),p=require('./node_modules/electron/package.json');assert.equal(fs.readFileSync('node_modules/electron/dist/version','utf8').trim().replace(/^v/,''),p.version);assert.equal(fs.readFileSync('node_modules/electron/dist/electron.exe').subarray(0,2).toString(),'MZ');"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Build isolated animation runtime
        run: |
          python -m venv work/animation-build-venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          work/animation-build-venv/Scripts/python.exe -m pip install --disable-pip-version-check -r tools/gif-factory/build-requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:ANIMATION_PYTHON = (Resolve-Path work/animation-build-venv/Scripts/python.exe).Path
          node scripts/build-animation-tool.mjs
      - name: Verify real local animation runtime
        run: node scripts/verify-animation-native.cjs --tool-exe work/animation-runtime/xuzuo-animation/xuzuo-animation.exe
      - name: Run offline animation Python tests
        run: work/animation-build-venv/Scripts/python.exe -B -m unittest discover -s tools/gif-factory/tests -v
      - name: Check backend dependencies
        run: node scripts/verify-runtime-dependencies.mjs
      - name: Verify generated runtime
        run: |
          node scripts/build-spreadsheet-runtime.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- electron
      - name: Verify native bead files and printed PDF
        run: node scripts/verify-bead-native.cjs
      - name: Verify native commerce typography and image capture
        run: node_modules/electron/dist/electron.exe scripts/verify-commerce-native.cjs --output=work/commerce-native-output
      - name: Verify isolated marketplace capture browser
        run: node scripts/verify-bead-market-browser.mjs
      - name: Type check
        run: node node_modules/typescript/bin/tsc -b --pretty false
      - name: Build renderer
        run: node node_modules/vite/bin/vite.js build
      - name: Verify actual business renderer interactions
        run: node scripts/verify-business-browser.mjs
      - name: Verify bead market native data and renderer
        run: node scripts/verify-bead-market-ui.mjs
      - name: Verify real animation studio interactions
        run: node scripts/verify-animation-studio.mjs
      - name: Run source tests with one worker
        id: source_tests
        if: ${{ !cancelled() }}
        run: |
          New-Item -ItemType Directory -Force -Path work | Out-Null
          node node_modules/vitest/vitest.mjs run --config .github/vitest.config.mjs --maxWorkers=1 --reporter=json --outputFile="$env:RUNNER_TEMP/xuzuo-vitest.json"
      - name: Record quick document delivery stages
        if: ${{ always() && (steps.source_tests.outcome == 'success' || steps.source_tests.outcome == 'failure') }}
        run: node node_modules/vitest/vitest.mjs run --config .github/vitest.config.mjs src/lib/quick-document-delivery.test.ts --maxWorkers=1 --reporter=verbose --silent=false
      - name: Verify complete results
        if: always()
        run: node scripts/verify-ci-result.mjs "$env:RUNNER_TEMP/xuzuo-vitest.json"
      - name: Retain complete test results
        if: ${{ always() && (steps.source_tests.outcome == 'success' || steps.source_tests.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xuzuo-source-test-results-${{ github.sha }}
          archive: true
          compression-level: 0
          retention-days: 1
          if-no-files-found: warn
          path: ${{ runner.temp }}/xuzuo-vitest.json
      - name: Record reference transport measurements
        run: node node_modules/vitest/vitest.mjs run --config .github/vitest.config.mjs src/pages/ImageReferenceInspection.test.tsx --maxWorkers=1 --reporter=verbose --silent=false
      - name: Measure isolated renderer recovery storage
        run: node scripts/measure-recovery-storage.mjs
      # Native decoding is verified without opening a window or calling a provider.
      - name: Verify native image reference normalization
        run: node scripts/verify-image-reference-normalization.cjs --engineering-large
      - name: Verify exact wallpaper device matrix
        run: node scripts/verify-wallpaper-matrix.mjs --full
      - name: Retain native output verification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: xuzuo-native-output-evidence-${{ github.sha }}
          archive: true
          compression-level: 0
          retention-days: 1
          if-no-files-found: warn
          path: |
            work/wallpaper-matrix-full.json
            work/image-reference-normalization-native.json
            work/bead-native-acceptance.json
            work/bead-native-output/*.pdf
            work/bead-native-output/*.png
            work/commerce-native-output/report.json
            work/commerce-native-output/*.png
            work/business-browser-output/report.json
            work/business-browser-output/*.png
            work/bead-market-browser-native-output/report.json
            work/bead-market-browser-native-output/parent-report.json
            work/bead-market-browser-native-output/*.png
            work/bead-market-ui-output/report.json
            work/bead-market-ui-output/*.png
            work/bead-market-ui-output/procurement.xlsx
            work/animation-native-output/report.json
            work/animation-native-output/*.gif
            work/animation-native-output/*-cover.png
            work/animation-native-output/synthetic-source.png
            work/animation-studio-output/report.json
            work/animation-studio-output/*.png
            work/animation-studio-output/*.gif
            work/animation-studio-output/*.zip
      - name: Build Windows drive helper
        run: node scripts/build-drive-helper.mjs
      - name: Build custom maintenance runtime
        run: node scripts/build-setup.mjs runtime
      - name: Package desktop application
        run: node node_modules/electron-builder/cli.js --win dir --publish never --config.electronDist=node_modules/electron/dist
      - name: Build custom Windows installer
        run: node scripts/build-setup.mjs package
      - name: Verify actual installer and packaged sources
        id: package_verification
        run: node scripts/verify-built-package.mjs
      - name: Verify Chromium draft retention on close
        id: close_retention
        if: ${{ !cancelled() && steps.package_verification.outcome == 'success' }}
        run: node scripts/verify-chromium-close-retention.mjs
      - name: Verify full runtime installation lifecycle
        id: full_install
        if: ${{ !cancelled() && steps.package_verification.outcome == 'success' }}
        run: node scripts/verify-full-install-lifecycle.mjs
      - name: Retain isolated quality evidence
        if: ${{ !cancelled() && steps.package_verification.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xuzuo-isolated-quality-${{ github.sha }}
          archive: true
          compression-level: 0
          retention-days: 1
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/xuzuo-chromium-close-*/report.json
            ${{ runner.temp }}/xuzuo-chromium-close-*/failure.json
            ${{ runner.temp }}/xuzuo-chromium-close-*/deadline-failure.json
            outputs/release-v2.5.2/full-install-lifecycle.json
      - name: Retain verified internal installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xuzuo-internal-windows-${{ github.sha }}
          archive: true
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
          path: |
            outputs/release-v2.5.2/Xuzuo-Studio-Setup-2.5.2.exe
            outputs/release-v2.5.2/Xuzuo-Studio-Setup-2.5.2.exe.blockmap
            outputs/release-v2.5.2/Xuzuo-Studio-Setup-2.5.2.manifest.json
            outputs/release-v2.5.2/latest.yml
            outputs/release-v2.5.2/package-verification.json
