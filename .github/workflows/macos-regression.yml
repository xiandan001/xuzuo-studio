name: macOS regression

on:
  push:
    branches: [develop-macos]
  pull_request:
    branches: [main, develop-macos]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        # Both labels are native hosts: Python/PyInstaller is never cross-built.
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CI: 'true'
      TZ: Asia/Shanghai
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Only ad-hoc signing is configured; no certificates or secrets enter PRs.
      CSC_FOR_PULL_REQUEST: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Prepare locked native Electron runtime
        run: node scripts/prepare-ci-electron.mjs
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Prepare isolated animation builder
        run: |
          python -m venv work/animation-build-venv
          work/animation-build-venv/bin/python -m pip install --disable-pip-version-check -r tools/gif-factory/build-requirements.txt
          echo "ANIMATION_PYTHON=$PWD/work/animation-build-venv/bin/python" >> "$GITHUB_ENV"
      - name: Check backend dependencies
        run: node scripts/verify-runtime-dependencies.mjs
      - name: Run source regressions
        run: npm test -- --config .github/vitest.config.mjs
      - name: Run Python regressions
        run: "$ANIMATION_PYTHON -B -m unittest discover -s tools/gif-factory/tests -v"
      - name: Package native macOS application
        run: npm run package:mac
      - name: Check exact bundled sources, native architecture and animation runtime
        run: npm run verify:mac
      - name: Launch packaged application and exercise desktop workflows
        run: node scripts/verify-macos-launch.mjs
      - name: Verify DMG mount and extracted ZIP application
        run: node scripts/verify-macos-installers.mjs
      - name: Exercise actual standalone animation runtime
        run: node scripts/verify-animation-native.cjs
      - name: Exercise native application and isolated workspace
        run: node_modules/electron/dist/Electron.app/Contents/MacOS/Electron scripts/verify-macos-desktop.cjs
      - name: Retain native installers and evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: xuzuo-macos-${{ matrix.os }}-${{ github.sha }}
          archive: true
          compression-level: 0
          retention-days: 7
          if-no-files-found: warn
          path: |
            outputs/release-v*/*-mac-*.dmg
            outputs/release-v*/*-mac-*.zip
            outputs/release-v*/macos-package-verification.json
            outputs/release-v*/macos-installer-verification.json
            work/macos-desktop-*/report.json
            work/macos-desktop-*/*.png
            work/macos-package-launch-*/report.json
            work/macos-package-launch-*/*.png
            work/animation-native-output/report.json
